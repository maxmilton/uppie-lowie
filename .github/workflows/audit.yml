name: audit

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/audit.yml"
      - "bun.lock"
      - "package.json"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 21 * * 3"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun audit

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Enable bun security scanner
        run: |
          printf '\n[install.security]\nscanner = "@socketsecurity/bun-security-scanner"\n' >> bunfig.toml
      - run: bun add -d @socketsecurity/bun-security-scanner
      - run: bun pm scan

  dedup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun dedupe --check
