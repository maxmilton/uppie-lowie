name: publish

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    if: ${{ github.repository_owner == 'maxmilton' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run lint
      - run: bun run test
      - run: zip -jv chrome-extension.zip dist/*
      - uses: actions/attest@v4
        with:
          subject-path: chrome-extension.zip
      - run: gh release create "$GITHUB_REF_NAME" chrome-extension.zip --draft --generate-notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
